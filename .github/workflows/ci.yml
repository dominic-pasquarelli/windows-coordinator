# Windows Coordinator — CI
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# WHAT THIS PIPELINE IS ALLOWED TO CLAIM — read this before trusting a green tick.
#
#   docs-audit     The documentation + modularity gate. It is stdlib-only Python 3.11 and needs no
#                  .NET at all, so it RUNS TODAY, on every push, and it is the only job in this file
#                  that is currently a real gate. A green run is a statement about *text*: links
#                  resolve, frontmatter parses, the ADR sequence is intact, no Windows namespace
#                  appears inside a Core project, docs/MAP.md is current. It is not a build.
#
#   core-tests     COMPILES every portable project and runs the Core suites. Windows-FREE logic
#                  ONLY, and this bounds it hard: it covers NO Shell adapter,
#                  NO window placement, NO hotkey capture, NO DPI or scaling behavior, NO tray
#                  presence, and NO UI. Those live behind P/Invoke and WinUI in the Shell adapters,
#                  which are not unit-tested by design (ADR 0003). The ONLY source of a claim about
#                  any of them is a human executing docs/runbooks/manual-validation.md on a real
#                  Windows desktop and writing down what happened, on what machine, on what date.
#                  A green core-tests is a statement about geometry math, schedule arithmetic,
#                  arbitration decisions, and settings migration. Nothing a user can see.
#
#   windows-build  A compile check, and only a compile check. Compiling is not running, and running
#                  is not working. See docs/OPERATING_MODEL.md §7 (the evidence standard) and its
#                  three failure shapes — a check that cannot fail · a claim stronger than its
#                  evidence · an error found after the expensive step.
#
# HONEST STATE OF THIS FILE (2026-08-08, second revision): no .NET SDK has ever been present in the
# environment this repository is authored in, so nothing here has been compiled LOCALLY. Both .NET
# jobs below now compile every project regardless — the first revision of this file skipped
# compilation whenever no solution file existed, which meant the repository could ship indefinitely
# having never run a compiler over its own C# while an SDK sat installed and idle in this very
# pipeline. **The absence of a solution is not a reason to skip a build**: a `.csproj` compiles on
# its own, and the solution (TD-2) is a tooling convenience, not a compiler prerequisite.
#
# So CI is now the first compiler this project has ever had, and the first run of these jobs is the
# first compile in its history. Expect real errors; that is the point, and a red build here is
# information rather than failure. Until a run is observed green, no document in this repository may
# say the C# compiles — report what the run actually returned.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # The gate that actually works today.
  #
  # It is deliberately the first job and deliberately has no .NET dependency: the whole point of
  # keeping tools/doc-audit/ stdlib-only is that the documentation contract stays enforceable in
  # every environment — a bare runner, a Linux laptop, the container this project was bootstrapped
  # in. If this job goes red, something in the repository is unambiguously broken (a dead link, a
  # dead path, invalid frontmatter, an ADR gap, a stale index, a Core project reaching for Win32).
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  docs-audit:
    name: Docs audit (code ↔ docs drift + the modularity boundary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The closeout check diffs the branch against its base, so it needs real history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Invoked directly rather than through `coord audit` on purpose: the launcher is a convenience
      # for humans, and CI should exercise the checker itself with the fewest moving parts between
      # the runner and the finding. `coord audit` is a thin wrapper over exactly this command.
      #
      # Exits non-zero on any ERROR-level finding. WARN and INFO are advisory and never fail — a
      # gate that fires on judgement calls trains you to ignore it (docs/AUDIT.md §5).
      - name: Mechanical drift check (fails on ERROR — see docs/AUDIT.md)
        run: python3 tools/doc-audit/audit.py

      # The generated doc index must equal a fresh regeneration. Generation is deterministic and
      # carries no timestamps, so a difference here is always a real change in the doc set, never
      # noise — which is what makes --check a gate rather than a flake.
      - name: Doc index is current (docs/MAP.md)
        run: python3 tools/doc-audit/genmap.py --check

      # The scaffold generates .csproj files, and a generated file is code. This suite creates a
      # module in a throwaway checkout and asserts every reference it produced resolves — the check
      # that was missing when a project rename broke `coord new-module` and two audits plus four
      # verifiers all passed it. Stdlib unittest, no .NET needed.
      - name: Tooling tests (`coord new-module` produces references that resolve)
        run: python3 -m unittest discover -s tools/coord/tests -v

      # Report-only, by design. Staleness is driven by time and repo churn, so failing on it would
      # block an unrelated PR after a quiet fortnight — friction that gets routed around rather than
      # fixed. It surfaces the accuracy backlog in the log where an audit can pick it up.
      - name: Accuracy backlog (advisory — docs overdue for an `audited` re-read)
        run: python3 tools/doc-audit/audit.py --accuracy

      # Branch closeout (DOC_SPEC §6): a doc changed on this branch must have bumped its `updated`
      # flag. This is the check that stops a doc being edited into a lie and left carrying an old
      # date that says "reviewed" when it was not.
      - name: Closeout — changed docs must bump `updated`
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/doc-audit/audit.py --since "origin/${{ github.base_ref }}"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Core tests — the portable half of the Core/Shell split (ADR 0003).
  #
  # These are plain net9.0 projects with zero Windows dependencies, which is exactly why they can
  # run on an ubuntu runner and why running them here means anything at all. What they cover is
  # narrow and stated again in the job name because it is the single most-blurred fact in this
  # project: Core logic, and nothing a user can see.
  #
  # NOT COVERED HERE, AT ALL — and not covered anywhere else in this file either:
  #   · the Shell adapters (P/Invoke, window handles, WinUI) — validated by hand, on purpose
  #   · window placement, snapping, and multi-monitor arrangement
  #   · hotkey capture, chord arbitration against the real OS, and hook-thread latency
  #   · DPI and per-monitor scaling behavior
  #   · the tray host, the settings UI, and settings survival across a restart
  # Every one of those is docs/runbooks/manual-validation.md, performed by a human on a real Windows
  # desktop, recorded with a machine and a date. There is no automated substitute and there is not
  # meant to be one.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  core-tests:
    name: Core build + tests (Windows-free logic only — no Shell, no placement, no hotkeys, no UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # ── Compile everything portable. No solution required. ──────────────────────────────────
      #
      # This job used to SKIP compilation whenever no solution file existed, and that was wrong in
      # a way worth recording: the absence of a `.sln` does not prevent compiling anything. A
      # `.csproj` builds perfectly well on its own. The repository shipped its first PR having
      # never once run a compiler over its own C#, while a .NET 9 SDK sat installed and idle three
      # lines above — an elaborate, carefully-worded account of an unverified state, when the
      # verification was available the whole time. Reported by review 2026-08-08.
      #
      # A Core project is `net9.0` with no `-windows` in its target framework, which is exactly
      # what makes it buildable here (ADR 0003). The Shell adapters cannot restore on Linux at all;
      # those belong to the windows-build job. Discovery is by declared TargetFramework rather than
      # by a hardcoded list, so a new pillar or module is covered the day it appears.
      - name: Discover and build every portable project
        id: portable
        shell: bash
        run: |
          set -euo pipefail
          portable=""
          while IFS= read -r proj; do
            [ -n "$proj" ] || continue
            tfm="$(grep -o '<TargetFramework[s]*>[^<]*<' "$proj" | head -n1 | sed 's/<[^>]*>//g' || true)"
            case "$tfm" in
              *-windows*) echo "skip (Windows-targeted): $proj  [$tfm]" ;;
              "")         echo "::warning title=No TargetFramework::$proj declares no TargetFramework; not built here." ;;
              *)          echo "portable: $proj  [$tfm]"; portable="$portable$proj"$'\n' ;;
            esac
          done < <(find src tests -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*' 2>/dev/null | sort)

          count="$(printf '%s' "$portable" | grep -c . || true)"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          # Guard the guard. If discovery ever matches nothing, every build below is skipped and
          # this job goes green having compiled nothing — the exact vacuous pass this project
          # names as failure shape 1. There are portable projects in this repository; zero means
          # discovery broke, not that there is nothing to do.
          if [ "$count" -eq 0 ]; then
            echo "::error title=No portable projects found::Discovery matched no net9.0 project under src/ or tests/. That is not an empty repository — it is a broken discovery step, and letting it pass would be a green job that compiled nothing."
            exit 1
          fi

          echo "Building $count portable project(s)."
          failed=0
          while IFS= read -r proj; do
            [ -n "$proj" ] || continue
            echo "::group::dotnet build $proj"
            if ! dotnet build "$proj" -c Release --nologo; then
              echo "::error title=Build failed::$proj"
              failed=1
            fi
            echo "::endgroup::"
          done < <(printf '%s' "$portable")

          [ "$failed" -eq 0 ] || exit 1

          {
            echo "### Core build"
            echo
            echo "Compiled **$count portable project(s)** on Linux with no solution file — a"
            echo "\`.csproj\` does not need one. This is a compile, and nothing more: it says"
            echo "nothing about behaviour."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Discover Core test projects
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          projects="$(find tests -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*' 2>/dev/null | sort || true)"
          count="$(printf '%s\n' "$projects" | grep -c . || true)"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          # Core logic with no Core test is the state the Core/Shell split exists to prevent
          # (docs/MODULE_SPEC.md §6). Now that portable projects are compiled above, "there is
          # Core code but nothing tests it" is always a real finding — there is no bootstrap
          # window in which it is acceptable.
          if [ "$count" -eq 0 ]; then
            echo "::error title=No Core test projects::Portable projects exist and compile, but tests/ contains no .csproj. Core logic without a Core test is exactly what the Core/Shell split exists to prevent (docs/MODULE_SPEC.md §6)."
            exit 1
          fi

          echo "Found $count Core test project(s):"
          printf '%s\n' "$projects"

      # Driven through the developer entry point on purpose, so CI and a human run the same code
      # path. `coord test` runs each discovered test project individually — never the solution —
      # so this job's meaning cannot widen as Windows projects are added.
      - name: Run the Core suites (`coord test`)
        run: python3 tools/coord/coord.py test -c Release

      - name: State plainly what a green run here does not cover
        run: |
          {
            echo
            echo "> Green means **Core logic only**. It is not a statement about window placement,"
            echo "> hotkey capture, DPI behavior, the tray, or the UI. Those come from"
            echo "> \`docs/runbooks/manual-validation.md\`, performed by a human, on a named machine,"
            echo "> on a date."
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Full-solution compile — the only job that can build the Windows-targeted half.
  #
  # The Shell adapters target net9.0-windows10.0.19041.0 and cannot restore on Linux at all (that is
  # the split working as designed, not a broken checkout), so this is the one place the whole
  # solution is exercised.
  #
  # THE GUARD, AND WHY IT IS NOT A VACUOUS PASS. There is no solution file in this repository yet:
  # a .sln carries per-project GUIDs that could not be generated or verified where this was authored,
  # so generating it on a Windows machine is the first task in docs/NEXT.md. Until then `dotnet
  # build` has nothing to point at. A job that reds out for that reason reports a non-finding on
  # every push; a job that swallows the failure is a check that cannot fail (docs/OPERATING_MODEL.md
  # §7, failure shape 1), which is strictly worse because it looks like evidence.
  #
  # The resolution: detect the solution's absence EXPLICITLY, say so loudly in the log and the run
  # summary, and skip only the build steps. The condition is not a permanent excuse — it stops being
  # true the moment `dotnet new sln` is run and the result is committed, which is a scheduled,
  # owned task with a name. And the guard has a failing branch of its own: if project files exist
  # under src/ while no solution does, that is a real inconsistency and this job goes red for it.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  windows-build:
    name: Windows build (full solution — compile only, never a behavior claim)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Detect the solution, or build every project directly
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          solution="$(find . -maxdepth 1 \( -name '*.sln' -o -name '*.slnx' \) | sort | head -n 1 || true)"
          projects="$(find src -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*' 2>/dev/null | sort || true)"
          project_count="$(printf '%s\n' "$projects" | grep -c . || true)"

          if [ -n "$solution" ]; then
            echo "has_solution=true" >> "$GITHUB_OUTPUT"
            echo "Found solution: $solution"

            # THE REAL GATE. Once a solution exists, every project under src/ must be in it —
            # a project silently missing from the solution builds for its author and for nobody
            # else, and neither `coord build` nor this job would otherwise notice.
            #
            # This condition is deliberately FALSE today (there is no solution yet, TD-2), and it
            # becomes checkable the moment one lands. That ordering is the point: a gate whose
            # failing branch is unreachable is decoration, and a gate that is red on every push
            # from day one is a gate nobody reads. This one is neither.
            missing=""
            while IFS= read -r proj; do
              [ -n "$proj" ] || continue
              name="$(basename "$proj")"
              grep -qF "$name" "$solution" || missing="$missing $name"
            done <<< "$projects"

            if [ -n "$missing" ]; then
              echo "::error title=Project missing from the solution::$solution does not include:$missing. Run 'dotnet sln add' for each and commit — a project outside the solution is not built by CI or by 'coord build'."
              exit 1
            fi

            { echo "### Windows build"; echo; echo "Building \`$solution\` ($project_count project(s), all present in the solution)."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_solution=false" >> "$GITHUB_OUTPUT"

          # NO SOLUTION IS NOT A REASON TO SKIP COMPILING. A `.csproj` builds on its own; the
          # solution is a convenience for tooling, not a prerequisite for a compiler. This job
          # previously skipped the whole build whenever the solution was absent, which meant the
          # Windows-targeted half could go unbuilt indefinitely behind a well-worded notice.
          # Reported by review 2026-08-08.
          if [ "$project_count" -eq 0 ]; then
            echo "::error title=No projects found::Discovery matched no .csproj under src/. That is a broken discovery step, not an empty repository."
            exit 1
          fi

          echo "::notice title=No solution file — building each project individually::No .sln/.slnx at the repository root (TD-2); building all $project_count project(s) under src/ directly."
          failed=0
          while IFS= read -r proj; do
            [ -n "$proj" ] || continue
            echo "::group::dotnet build $proj"
            if ! dotnet build "$proj" -c Release --nologo; then
              echo "::error title=Build failed::$proj"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "$projects"

          [ "$failed" -eq 0 ] || exit 1

          {
            echo "### Windows build — every project, no solution"
            echo
            echo "Compiled **$project_count project(s)** under \`src/\` individually. There is no"
            echo "\`.sln\`/\`.slnx\` at the repository root yet — tracked as **TD-2**, because a"
            echo "solution carries per-project GUIDs that could not be generated where this"
            echo "repository was authored. That is a tooling convenience, not a compiler"
            echo "prerequisite, so it is no longer a reason to leave the C# unbuilt."
            echo
            echo "**A compile is a compile.** It says nothing about the tray, window placement,"
            echo "hotkey capture, DPI behaviour, or the UI."
          } >> "$GITHUB_STEP_SUMMARY"

      # Through the Windows launcher, so CI drives the same entry point a developer at the machine
      # would (`coord.cmd` finds its own interpreter — `python`, then the `py` launcher).
      - name: Build the solution (`coord build`)
        if: steps.detect.outputs.has_solution == 'true'
        run: .\coord.cmd build -c Release

      # A compile is a compile. Say so where someone reading the run will see it, because "the
      # Windows build is green" is the single easiest sentence in this project to over-read.
      - name: State plainly what a green build here does not mean
        if: steps.detect.outputs.has_solution == 'true'
        shell: bash
        run: |
          {
            echo
            echo "> A green build proves the C# **compiles**. It does not prove the host starts, a"
            echo "> hotkey registers, a window moves, the tray icon appears, or that anything"
            echo "> survives a restart. Those are \`docs/runbooks/manual-validation.md\`, performed"
            echo "> by a human on a real desktop, recorded with a machine and a date."
          } >> "$GITHUB_STEP_SUMMARY"
